<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>COPAI GPS - Sin Conexión</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      body {
        min-height: 100vh;
        background: radial-gradient(circle at 50% 20%, #0f172a 0%, #020617 75%);
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(56, 189, 248, 0.2);
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
      }
      .icon-wrap {
        width: 68px;
        height: 68px;
        margin: 0 auto 18px;
        border-radius: 20px;
        background: rgba(14, 165, 233, 0.12);
        border: 1px solid rgba(14, 165, 233, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { font-size: 19px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.01em; }
      p { font-size: 13px; line-height: 1.55; color: #94a3b8; margin-bottom: 24px; }
      button {
        width: 100%;
        padding: 14px 18px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(135deg, #0284c7, #2563eb);
        color: #fff;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.4);
      }
      button:active { transform: scale(0.98); }
      .foot { margin-top: 16px; font-size: 11px; color: #64748b; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-wrap">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Sin conexión a Internet</h1>
      <p>
        Activa tus datos móviles o Wi-Fi para sincronizar en tiempo real la ubicación satelital y alertas de tu flota.
      </p>
      <button type="button" onclick="retryConnection()">Reintentar Conexión</button>
      <div class="foot">COPAI Telematics GPS • Conexión Cifrada SSL</div>
    </div>
    <script>
      function retryConnection() {
        window.location.replace('https://industriascopai.com');
      }
      window.addEventListener('online', retryConnection);
    </script>
  </body>
</html>
