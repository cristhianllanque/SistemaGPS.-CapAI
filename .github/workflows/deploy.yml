name: CI/CD Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Validar Código y Compilación
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar y Compilar Frontend
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Validar Sintaxis Backend
        working-directory: ./backend
        run: |
          pip install -r requirements.txt --quiet
          python -m compileall app/

  deploy:
    name: Despliegue Autónomo a AWS EC2
    needs: validate-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar Despliegue vía SSH en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Iniciando despliegue en industriascopai.com..."
            
            # Directorio del proyecto en EC2
            cd /home/ubuntu/copay-telematics || cd /var/www/copay/app || exit 1

            # 1. Actualizar código desde GitHub
            echo "📥 Descargando últimos cambios desde origin/main..."
            git pull origin main

            # 2. Actualizar dependencias de Backend
            echo "🐍 Actualizando backend y entorno virtual..."
            cd backend
            if [ -d "venv" ]; then
              source venv/bin/activate
            else
              python3 -m venv venv
              source venv/bin/activate
            fi
            pip install -r requirements.txt --quiet
            mkdir -p uploads/logos uploads/banners
            chmod -R 775 uploads

            # 3. Reiniciar servicio FastAPI y TCP Teltonika
            echo "🔄 Reiniciando servicio FastAPI y TCP Teltonika..."
            sudo systemctl restart copay-backend

            # 4. Compilar Frontend y copiar a Nginx
            echo "⚛️ Compilando Frontend de Producción..."
            cd ../frontend
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            npm install --legacy-peer-deps --silent
            npm run build

            # 5. Publicar archivos en el directorio web de Nginx
            echo "🌐 Publicando archivos estáticos en Nginx..."
            sudo rm -rf /var/www/copay/html/*
            sudo cp -r dist/* /var/www/copay/html/
            sudo chown -R www-data:www-data /var/www/copay/html

            # 6. Actualizar configuración de Nginx para soporte de subdominios y recargar
            echo "🌐 Actualizando configuración de Nginx..."
            sudo cp /home/ubuntu/copay-telematics/deployment/nginx_industriascopai.conf /etc/nginx/sites-available/industriascopai.com
            sudo ln -sf /etc/nginx/sites-available/industriascopai.com /etc/nginx/sites-enabled/
            sudo nginx -t
            sudo systemctl reload nginx

            echo "✅ [CI/CD] ¡Despliegue completado con éxito en industriascopai.com!"
