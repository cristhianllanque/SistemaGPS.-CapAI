# ==============================================================================
# Configuración Nginx para industriascopai.com y Subdominios Multi-Empresa
# Copay Telematics GPS & IoT Platform
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Redirección HTTP (Puerto 80)
# ------------------------------------------------------------------------------

# 1.A. Subdominios de empresas clientes (ej: huaynaroque.industriascopai.com)
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<tenant>[a-zA-Z0-9_-]+)\.industriascopai\.com$;

    # Desafíos ACME de Certbot para renovación automática
    location /.well-known/acme-challenge/ {
        root /var/www/copay/html;
    }

    # Redirección inmediata al portal seguro de la empresa
    location / {
        return 301 https://industriascopai.com/?empresa=$tenant;
    }
}

# 1.B. Dominio Principal y WWW en HTTP -> HTTPS Seguro
server {
    listen 80;
    listen [::]:80;
    server_name industriascopai.com www.industriascopai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/copay/html;
    }

    location / {
        return 301 https://industriascopai.com$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. Servidores Seguros HTTPS (Puerto 443)
# ------------------------------------------------------------------------------

# 2.A. Subdominios de empresas clientes en HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<tenant>[a-zA-Z0-9_-]+)\.industriascopai\.com$;

    ssl_certificate /etc/letsencrypt/live/industriascopai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/industriascopai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Redirección transparente al portal unificado de la empresa
    location / {
        return 301 https://industriascopai.com/?empresa=$tenant;
    }
}

# 2.B. Portal Principal y Aplicación Completa (industriascopai.com y www)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name industriascopai.com www.industriascopai.com;

    # Certificados SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/industriascopai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/industriascopai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Tamaño máximo de subida para logotipos PNG y fotos de unidades
    client_max_body_size 25M;

    # Compresión GZIP de alta eficiencia
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Directorio de la aplicación Frontend compilada (React + Vite)
    root /var/www/copay/html;
    index index.html;

    # Enrutamiento SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API REST de FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # WebSockets en tiempo real (Flota, Telemetría, Alertas)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Mantener el socket abierto sin timeouts prematuros
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Archivos estáticos subidos (Logos de empresas clientes y banners)
    location /uploads/ {
        alias /home/ubuntu/copay-telematics/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Cache para assets estáticos generados por Vite
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
